<!DOCTYPE html>
<html>
<head>
  <title>Kepulangan Santri</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #061b14 center / cover fixed no-repeat; color: #111; min-height: 100vh; }
    @media (orientation: landscape) {
      body.berlatar { background-image: linear-gradient(rgba(0,0,0,.45), rgba(0,0,0,.45)), var(--foto); }
    }
    @media (orientation: portrait) {
      body.berlatar { background-image: var(--foto); background-size: 100% auto; background-position: top center; background-attachment: scroll; }
      body.berlatar .wrap { padding-top: 58vw; }
    }
    /* Latar foto potret khusus HP */
    body.berlatar.latar-hp { background-image: linear-gradient(rgba(0,0,0,.4), rgba(0,0,0,.4)), var(--foto-hp);
                             background-size: cover; background-position: center top; background-attachment: fixed; }
    body.berlatar.latar-hp .wrap { padding-top: 12px; }
    .wrap { max-width: 520px; margin: 0 auto; padding: 12px; }
    h1 { font-size: 22px; text-align: center; margin: 12px 0 8px; color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,.6); }
    #stat { text-align: center; font-weight: bold; margin-bottom: 8px; color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,.6); }
    #reader { width: 100%; background: #000; border-radius: 10px; overflow: hidden; }
    .kotak { margin-top: 12px; padding: 22px 12px; border-radius: 10px; text-align: center; background: rgba(255,255,255,.92); }
    .kotak .judul { font-size: 22px; font-weight: bold; }
    .kotak .nama { font-size: 26px; font-weight: bold; margin: 8px 0; }
    .valid { background: #16a34a; color: #fff; }
    .sudah { background: #f59e0b; color: #111; }
    .palsu { background: #dc2626; color: #fff; }
    .error { background: #6b7280; color: #fff; }
    .baris { display: flex; gap: 8px; margin-top: 12px; }
    input, button { font-size: 16px; padding: 10px; border-radius: 8px; border: 1px solid #9ca3af; }
    input { flex: 1; min-width: 0; }
    button { background: #0066AE; color: #fff; border: none; }
    #login { margin-top: 40px; text-align: center; color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,.6); }
    #login .baris { justify-content: center; }
    /* Lencana kategori tamu */
    .lencana { display: inline-block; padding: 4px 16px; border-radius: 999px; font-weight: bold; margin-bottom: 8px; }
    .lencana.vip { background: #facc15; color: #1f2937; }
    .lencana.umum { border: 2px solid currentColor; }
    #layar .lencana { font-size: min(5vw, 8vh); padding: 1vh 4vw; margin-bottom: 3vh; }
    .lencana.wisuda { background: #7c3aed; color: #fff; }
    .lencana.wisudavip { background: #facc15; color: #4c1d95; border: 3px solid #7c3aed; }
    /* Foto wisudawan */
    .foto { display: block; margin: 0 auto 10px; border-radius: 12px; border: 4px solid rgba(255,255,255,.9);
            object-fit: cover; background: rgba(0,0,0,.25); }
    .kotak .foto { width: 110px; height: 140px; }
    #layar .foto { height: 36vh; width: auto; aspect-ratio: 3 / 4; margin-bottom: 2vh; }
    #layar.ada-foto .lencana { font-size: min(4vw, 6vh); margin-bottom: 1.5vh; }
    #layar.ada-foto .besar { font-size: min(6vw, 9vh); }
    #layar.ada-foto .nama { font-size: min(6vw, 9vh); margin: 1.5vh 0; }
    #layar.ada-foto .kecil { font-size: min(3.2vw, 4.5vh); }
    /* Tombol suara */
    #btnSuara { position: fixed; top: 10px; left: 10px; z-index: 50; width: 44px; height: 44px; border-radius: 50%;
                padding: 0; font-size: 20px; background: rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.4); }
    #sambung { margin-top: 8px; text-align: center; font-size: 13px; color: #fff; opacity: .85;
               text-shadow: 0 1px 4px rgba(0,0,0,.7); }
    /* Mode layar (laptop / proyektor) */
    body.mode-layar .wrap { max-width: 900px; }
    body.mode-layar h1 { font-size: 40px; }
    body.mode-layar #stat { font-size: 28px; }
    body.mode-layar .kotak { font-size: 28px; padding: 40px 12px; }
    /* Video latar (YouTube) */
    #videoLatar { position: fixed; top: 0; left: 0; right: 0; bottom: 0; overflow: hidden; z-index: -1; pointer-events: none; }
    #videoLatar iframe { position: absolute; top: 50%; left: 50%; width: max(115vw, 204.5vh); height: max(64.7vw, 115vh);
                         transform: translate(-50%, -50%); border: 0; }
    #videoLatar .gelap { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.4); }
    /* Popup status layar penuh */
    #layar { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 100; display: none;
             flex-direction: column; align-items: center; justify-content: center; text-align: center;
             padding: 24px; box-sizing: border-box; }
    #layar .besar { font-size: min(9vw, 14vh); font-weight: bold; line-height: 1.1; }
    #layar .nama { font-size: min(8vw, 12vh); font-weight: bold; margin: 4vh 0; word-break: break-word; }
    #layar .kecil { font-size: min(4vw, 6vh); }
    #layar .x { position: absolute; top: 16px; right: 16px; width: 60px; height: 60px; border-radius: 50%;
                border: 3px solid currentColor; background: rgba(0,0,0,.25); color: inherit;
                font-size: 30px; line-height: 1; padding: 0; cursor: pointer; }

    /* ===== MODE MULTI-SLOT (mode=layar) ===== */
    #arena { position: fixed; inset: 0; display: none; z-index: 90;
             padding: 10px; box-sizing: border-box; grid-gap: 10px; }
    #arena.aktif { display: grid; }
    .slot { border-radius: 16px; overflow: hidden; position: relative;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 14px 10px 10px; }
    .slot.masuk  { animation: masukS .4s cubic-bezier(.22,1,.36,1) both; }
    .slot.keluar { animation: keluarS .35s ease forwards; pointer-events: none; }
    @keyframes masukS  { from { opacity:0; transform:scale(.88) translateY(16px); } to { opacity:1; transform:none; } }
    @keyframes keluarS { from { opacity:1; transform:none; } to { opacity:0; transform:scale(.92) translateY(-10px); } }
    .slot .lencana-s { font-weight:bold; border-radius:999px; padding:3px 14px; display:inline-block; margin-bottom:6px; }
    .slot .lencana-s.boleh  { background:#16a34a; color:#fff; }
    .slot .lencana-s.larang { background:#fff; color:#b91c1c; }
    .slot .nama-s  { font-weight:bold; word-break:break-word; line-height:1.15; margin:4px 0; }
    .slot .sub-s   { opacity:.85; line-height:1.3; margin-bottom:4px; }
    .slot .tanya-s { font-weight:bold; margin:8px 0 6px; }
    .slot .aksi-s  { display:flex; flex-direction:column; gap:6px; width:100%; max-width:320px; }
    .slot .aksi-s:empty { display:none; }
    .slot .aksi-s button { padding:9px 6px; border-radius:10px; border:2px solid rgba(255,255,255,.85);
                           background:rgba(0,0,0,.22); color:#fff; cursor:pointer; font-weight:500; width:100%; }
    .slot .aksi-s button:hover { background:rgba(0,0,0,.38); }
    .slot .aksi-s button.utama { background:#fff; color:#111; font-weight:bold; }
    .slot .aksi-s button:disabled { opacity:.42; cursor:default; }
    .slot .x-s { position:absolute; top:6px; right:6px; width:30px; height:30px; border-radius:50%;
                 background:rgba(0,0,0,.3); border:2px solid rgba(255,255,255,.6); color:#fff;
                 font-size:14px; cursor:pointer; display:none; align-items:center; justify-content:center; }
    .slot.akhir .x-s { display:flex; }
    .slot input.ket-s { font-size:15px; padding:7px 8px; width:100%; box-sizing:border-box;
                        border-radius:8px; border:2px solid #fff; color:#111; margin-bottom:4px; }
    .slot .progres-s { position:absolute; bottom:0; left:0; height:4px; background:rgba(255,255,255,.6);
                       border-radius:0 0 0 16px; transition:width linear; }
    .slot.valid-s { background:linear-gradient(145deg,#16a34a 0%,#15803d 58%,#166534 100%); color:#fff;
                    border:1px solid rgba(255,255,255,.28); box-shadow:0 12px 35px rgba(0,0,0,.24), inset 0 1px 0 rgba(255,255,255,.18); }
    .slot.valid-s::before { content:'✦'; position:absolute; top:12%; left:9%; font-size:clamp(18px,2.4vw,36px); color:rgba(255,255,255,.22); }
    .slot.valid-s::after { content:'✦'; position:absolute; bottom:13%; right:10%; font-size:clamp(22px,3vw,44px); color:rgba(255,255,255,.2); }
    .slot.valid-s .lencana-s { order:1; background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.65); color:#fff; letter-spacing:.04em; }
    .slot.valid-s .tanya-s { order:2; font-size:clamp(17px,2.2vw,34px); line-height:1.12; text-shadow:0 2px 8px rgba(0,0,0,.18); margin:8px 0; }
    .slot.valid-s .nama-s { order:3; text-transform:uppercase; letter-spacing:.015em; text-shadow:0 2px 8px rgba(0,0,0,.16); }
    .slot.valid-s .kelas-s { order:4; }
    .slot.valid-s .info-s { order:5; padding:7px 12px; border-radius:10px; background:rgba(0,0,0,.12); max-width:95%; }
    .slot.valid-s .salam-s { order:6; margin-top:10px; font-size:clamp(15px,2vw,28px); font-weight:900; letter-spacing:.12em; text-transform:uppercase; }
    .slot.valid-s .pesan-s { order:7; margin-top:4px; font-size:clamp(10px,1.05vw,16px); opacity:.9; }
    .slot.valid-s .progres-s { height:5px; background:rgba(255,255,255,.9); }
    .slot.sudah-s { background:#b45309; color:#fff; }
    .slot.palsu-s { background:#b91c1c; color:#fff; }
    .slot.biru-s  { background:#0066AE; color:#fff; }
    #arena[data-n="1"] { grid-template-columns:1fr; grid-template-rows:1fr; }
    #arena[data-n="2"] { grid-template-columns:1fr 1fr; grid-template-rows:1fr; }
    #arena[data-n="3"],#arena[data-n="4"] { grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; }
    #arena[data-n="5"],#arena[data-n="6"] { grid-template-columns:1fr 1fr 1fr; grid-template-rows:1fr 1fr; }
    #arena[data-n="1"] .nama-s{font-size:min(7vw,9vh)} #arena[data-n="1"] .sub-s{font-size:min(3.2vw,4.2vh)}
    #arena[data-n="1"] .tanya-s{font-size:min(5vw,6vh)} #arena[data-n="1"] .aksi-s button{font-size:min(3.2vw,3.8vh)} #arena[data-n="1"] .lencana-s{font-size:min(3.5vw,4.5vh)}
    #arena[data-n="2"] .nama-s{font-size:min(3.8vw,5vh)} #arena[data-n="2"] .sub-s{font-size:min(1.8vw,2.4vh)}
    #arena[data-n="2"] .tanya-s{font-size:min(2.8vw,3.5vh)} #arena[data-n="2"] .aksi-s button{font-size:min(2vw,2.6vh)} #arena[data-n="2"] .lencana-s{font-size:min(2vw,2.8vh)}
    #arena[data-n="3"] .nama-s,#arena[data-n="4"] .nama-s{font-size:min(2.4vw,3.4vh)}
    #arena[data-n="3"] .sub-s,#arena[data-n="4"] .sub-s{font-size:min(1.4vw,1.8vh)}
    #arena[data-n="3"] .tanya-s,#arena[data-n="4"] .tanya-s{font-size:min(1.9vw,2.6vh)}
    #arena[data-n="3"] .aksi-s button,#arena[data-n="4"] .aksi-s button{font-size:min(1.5vw,2vh);padding:7px 6px}
    #arena[data-n="3"] .lencana-s,#arena[data-n="4"] .lencana-s{font-size:min(1.6vw,2.2vh)}
    #arena[data-n="5"] .nama-s,#arena[data-n="6"] .nama-s{font-size:min(2vw,2.8vh)}
    #arena[data-n="5"] .sub-s,#arena[data-n="6"] .sub-s{font-size:min(1.1vw,1.5vh)}
    #arena[data-n="5"] .tanya-s,#arena[data-n="6"] .tanya-s{font-size:min(1.6vw,2.1vh)}
    #arena[data-n="5"] .aksi-s button,#arena[data-n="6"] .aksi-s button{font-size:min(1.3vw,1.7vh);padding:5px 4px}
    #arena[data-n="5"] .lencana-s,#arena[data-n="6"] .lencana-s{font-size:min(1.3vw,1.8vh)}
    /* Kepulangan: lencana status izin, warna, dan tombol di popup */
    .lencana.boleh { background: #16a34a; color: #fff; }
    .lencana.larang { background: #fff; color: #b91c1c; }
    .biru { background: #0066AE; color: #fff; }
    #layar { overflow-y: auto; }
    #layar.pl .lencana { font-size: min(4vw, 5.5vh); margin-bottom: 1.5vh; }
    #layar.pl .besar { font-size: min(6.5vw, 8vh); }
    #layar.pl .nama { font-size: min(6vw, 8vh); margin: 1.5vh 0; }
    #layar.pl .kecil { font-size: min(3.6vw, 4.5vh); margin-top: .6vh; }
    #layar .aksi { display: flex; flex-direction: column; gap: 12px; width: min(92vw, 520px); margin-top: 3vh; }
    #layar .btn { font-size: 20px; padding: 16px; border-radius: 12px; border: 3px solid rgba(255,255,255,.9);
                  background: rgba(0,0,0,.25); color: inherit; cursor: pointer; }
    #layar .btn.utama { background: #fff; color: #111; font-weight: bold; }
    #layar .btn:disabled { opacity: .45; cursor: default; }
    #layar input.ket { font-size: 20px; padding: 14px; width: 100%; box-sizing: border-box; border-radius: 10px;
                       border: 3px solid #fff; color: #111; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>
  <div class="wrap">
    <h1 id="judul">Kepulangan Santri</h1>

    <div id="login">
      <p>Masukkan PIN petugas</p>
      <div class="baris">
        <input id="pin" type="password" inputmode="numeric" placeholder="PIN">
        <button onclick="masuk()">Masuk</button>
      </div>
    </div>

    <div id="app" hidden>
      <div id="stat"></div>
      <div id="reader"></div>
      <div id="hasil" class="kotak">Arahkan kamera ke QR santri</div>
      <div id="sambung"></div>
      <div id="fotoBaris" class="baris">
        <button style="flex:1; padding:16px; font-size:18px;" onclick="document.getElementById('foto').click()">📷 Scan QR dengan kamera HP</button>
        <input type="file" id="foto" accept="image/*" capture="environment" hidden>
      </div>
      <div id="bacaFoto" style="display:none"></div>
      <div id="manualBaris" class="baris">
        <input id="manual" placeholder="Atau ketik / scan kode manual">
        <button onclick="cekManual()">Cek</button>
      </div>
    </div>
  </div>

<button id="btnSuara" onclick="ubahSuara()" aria-label="Suara">🔊</button>
<div id="arena"></div>
<div id="layar"></div>

<script>

  // ===== PENGATURAN TAMPILAN =====
  // Alamat web app Apps Script (hasil Deploy, berakhiran /exec). Sama dengan alamat di index.html
  const API_URL = 'https://script.google.com/macros/s/AKfycbynnIbA-TiK1ebj2BDSSoZBFqe8Lz7kITnDY7448gGt5_dc3qjHattle33yVgvQxGE/exec';
  const NAMA_ACARA = 'Kepulangan Santri';
  const VIDEO_YOUTUBE_ID = '';   // ID video YouTube untuk latar di layar laptop; kosongkan jika tidak dipakai
  // Alamat folder situs ini (otomatis mengikuti alamat GitHub Pages Anda)
  const ALAMAT_FOTO = new URL('.', location.href).href;
  // Suara saat scan: true = hidup, false = mati
  const SUARA_HP = true;
  const SUARA_LAYAR = true;
  const KONFIRMASI_AKHIR = false;
  const TUTUP_OTOMATIS_MS = 3000;
  const TUTUP_SLOT_MS = 5000; // Hasil akhir tampil 5 detik, lalu kartu menutup otomatis
  // Setelah petugas memilih jawaban terakhir, langsung disimpan (false). Ganti true bila ingin ada layar konfirmasi
  // Layar hasil menutup sendiri setelah sekian milidetik (0 = tidak menutup sendiri). Layar penolakan dua kali lebih lama
  // ================================

  // Mode halaman (diatur lewat alamat web):
  //   ''      = scan dan tampil di satu perangkat
  //   'hp'    = HP petugas untuk scan dan menjawab pertanyaan
  //   'layar' = laptop/proyektor hanya menampilkan hasil dari HP
  const MODE_URL = new URLSearchParams(location.search).get('mode');
  const MODE = (MODE_URL === 'hp' || MODE_URL === 'layar') ? MODE_URL : '';

  // Komunikasi ke Apps Script (dikirim sebagai teks biasa agar tidak diblokir CORS)
  function api(aksi, data) {
    const pengendali = new AbortController();
    const batas = setTimeout(function () { pengendali.abort(); }, 12000);
    return fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify(Object.assign({ aksi: aksi }, data)),
      signal: pengendali.signal
    })
      .then(function (r) { return r.json(); })
      .catch(function (e) {
        if (e && e.name === 'AbortError') throw new Error('Server terlalu lama merespons');
        throw e;
      })
      .finally(function () { clearTimeout(batas); });
  }

  document.getElementById('judul').textContent = NAMA_ACARA;
  if (MODE === 'layar') {
    document.body.classList.add('mode-layar');
    document.getElementById('reader').style.display = 'none';
    document.getElementById('manualBaris').style.display = 'none';
    document.getElementById('fotoBaris').style.display = 'none';
  }

  // Video latar: hanya di laptop/proyektor (mode layar), tidak di HP petugas
  if (VIDEO_YOUTUBE_ID && MODE === 'layar') {
    const wadah = document.createElement('div');
    wadah.id = 'videoLatar';
    const tempat = document.createElement('div');
    tempat.id = 'ytPemutar';
    wadah.appendChild(tempat);
    const g = document.createElement('div');
    g.className = 'gelap';
    wadah.appendChild(g);
    document.body.appendChild(wadah);
    window.onYouTubeIframeAPIReady = function () {
      const p = new YT.Player('ytPemutar', {
        videoId: VIDEO_YOUTUBE_ID,
        playerVars: { autoplay: 1, mute: 1, controls: 0, rel: 0, modestbranding: 1,
                      playsinline: 1, disablekb: 1, iv_load_policy: 3, fs: 0 },
        events: {
          onReady: function (e) { e.target.mute(); e.target.playVideo(); },
          onStateChange: function (e) {
            if (e.data === YT.PlayerState.ENDED) { e.target.seekTo(0); e.target.playVideo(); }
          }
        }
      });
      setInterval(function () {
        try {
          const d = p.getDuration();
          if (d > 0 && p.getCurrentTime() >= d - 1) { p.seekTo(0); p.playVideo(); }
        } catch (err) {}
      }, 500);
    };
    const skrip = document.createElement('script');
    skrip.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(skrip);
  }

  let pin = '';
  let sibuk = false;
  let kodeTerakhir = '';
  let waktuTerakhir = 0;
  let idTampil = null;
  let qna = null;   // keadaan pertanyaan yang sedang dijawab petugas
  let timerTutup = null;

  function masuk() {
    siapkanSuara();
    pin = document.getElementById('pin').value;
    api('pl_cek', { kode: '', pin: pin })
      .then(function (r) {
        if (r.status === 'PIN_SALAH') { alert('PIN salah'); return; }
        if (r.status === 'ERROR') { alert(r.pesan); return; }
        document.getElementById('login').hidden = true;
        document.getElementById('app').hidden = false;
        isiStat(r);
        tampilIdle();
        if (MODE === 'layar') pantau(); else { mulaiKamera(); jagaSambungan(); }
      })
      .catch(function (e) { alert('Gagal terhubung ke server: ' + e.message); });
  }

  document.getElementById('pin').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') masuk();
  });
  document.getElementById('foto').addEventListener('change', bacaFoto);
  document.addEventListener('click', siapkanSuara);
  document.getElementById('manual').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') cekManual();
  });

  // Menjaga server tetap "hangat" dan hitungan tetap segar: permintaan ringan tiap 40 detik saat petugas tidak sedang bekerja
  function jagaSambungan() {
    setInterval(function () {
      if (document.getElementById('layar').style.display === 'flex') return;
      api('pl_cek', { kode: '', pin: pin })
        .then(function (r) {
          if (r && r.total !== undefined && document.getElementById('layar').style.display !== 'flex') isiStat(r);
        })
        .catch(function () {});
    }, 40000);
  }

  // ---------- Mode layar: memantau hasil terbaru dari HP ----------
  function catatSambung(ok) {
    if (MODE !== 'layar') return;
    document.getElementById('sambung').textContent = ok
      ? '● Tersambung · diperiksa ' + new Date().toLocaleTimeString('id-ID')
      : '○ Terputus, mencoba lagi...';
  }

  function pantau() {
    api('pl_terakhir', { pin: pin, sesudah: idTampil === null ? undefined : idTampil })
      .then(function (r) {
        catatSambung(true);
        if (r && r.items) {
          if (idTampil === null) {
            idTampil = r.items.length > 0 ? r.items[r.items.length - 1].id : '';
          } else {
            r.items.forEach(function (item) {
              idTampil = item.id;
              tampil(item);
            });
          }
        } else if (idTampil === null) {
          idTampil = '';
        }
      })
      .catch(function () { catatSambung(false); })
      .then(function () { setTimeout(pantau, 1000); });
  }

  // ---------- Mode scan ----------
  function pengaturanQR() {
    return (typeof Html5QrcodeSupportedFormats !== 'undefined')
      ? { formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE], verbose: false }
      : { verbose: false };
  }

  function mulaiKamera() {
    const scanner = new Html5Qrcode('reader', pengaturanQR());
    scanner.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: 250 },
      function (teks) { proses(teks); },
      function () {}
    ).catch(function () {
      tampil({ status: 'KAMERA', pesan: 'Kamera tidak bisa dibuka. Izinkan akses kamera di browser, atau pakai tombol "Scan QR dengan kamera HP" di bawah.' });
    });
  }

  function cekManual() {
    const el = document.getElementById('manual');
    const kode = el.value.trim();
    el.value = '';
    if (kode) proses(kode);
  }

  // ---------- Scan lewat foto (kamera bawaan HP, tanpa izin kamera di halaman) ----------
  let pembacaFoto = null;

  function kecilkan(file) {
    return new Promise(function (ok, gagal) {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = function () {
        const skala = Math.min(1, 1280 / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * skala);
        c.height = Math.round(img.height * skala);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob(function (b) {
          if (b) ok(new File([b], 'qr.jpg', { type: 'image/jpeg' })); else gagal();
        }, 'image/jpeg', 0.92);
      };
      img.onerror = gagal;
      img.src = url;
    });
  }

  function bacaFoto(ev) {
    const file = ev.target.files && ev.target.files[0];
    ev.target.value = '';
    if (!file || sibuk) return;
    tampil({ status: 'LOADING' });
    kecilkan(file)
      .then(function (f) {
        if (!pembacaFoto) pembacaFoto = new Html5Qrcode('bacaFoto', pengaturanQR());
        return pembacaFoto.scanFile(f, false);
      })
      .then(function (teks) { proses(teks); })
      .catch(function () {
        tampil({ status: 'KAMERA', pesan: 'QR tidak terbaca. Foto lagi lebih dekat dan terang, pastikan seluruh QR terlihat.' });
        setTimeout(tampilIdle, 3500);
      });
  }


  function proses(kode) {
    kode = String(kode).trim();
    const sekarang = Date.now();
    if (sibuk) return;
    if (kode === kodeTerakhir && sekarang - waktuTerakhir < 8000) return;
    sibuk = true;
    kodeTerakhir = kode;
    waktuTerakhir = sekarang;
    tampil({ status: 'LOADING' });

    api('pl_cek', { kode: kode, pin: pin })
      .then(function (r) { tampil(r); })
      .catch(function (e) { tampil({ status: 'ERROR', pesan: 'Gagal: ' + e.message }); });
  }

  // ---------- Suara ----------
  let audioCtx = null;
  let suaraNyala = true;

  function siapkanSuara() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) {}
  }

  function nada(freq, mulai, durasi, jenis, vol) {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    const t = audioCtx.currentTime + mulai;
    o.type = jenis || 'sine';
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.3, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + durasi);
    o.connect(g);
    g.connect(audioCtx.destination);
    o.start(t);
    o.stop(t + durasi + 0.05);
  }

  function bunyi(r) {
    if (!suaraNyala || !audioCtx) return;
    try {
      const s = r.status;
      if (s === 'PULANG_OK') {                         // pulang dicatat: ding-ding naik
        nada(880, 0, 0.18, 'sine', 0.35);
        nada(1320, 0.16, 0.3, 'sine', 0.35);
      } else if (s === 'BOLEH' || s === 'PROSES') {    // boleh pulang, menunggu pertanyaan: satu nada pendek
        nada(740, 0, 0.18, 'sine', 0.3);
      } else if (s === 'DILARANG' || s === 'PALSU') {  // ditolak: dengung rendah
        nada(160, 0, 0.7, 'sawtooth', 0.25);
      } else if (s === 'SUDAH_PULANG' || s === 'IZIN_KOSONG') {   // perlu perhatian: dua bunyi peringatan
        nada(330, 0, 0.18, 'square', 0.2);
        nada(330, 0.28, 0.18, 'square', 0.2);
      }
    } catch (e) {}
  }

  function ubahSuara() {
    siapkanSuara();
    suaraNyala = !suaraNyala;
    document.getElementById('btnSuara').textContent = suaraNyala ? '🔊' : '🔇';
    if (suaraNyala) bunyi({ status: 'PULANG_OK' });
  }

  // ---------- Tampilan ----------
  function isiStat(r) {
    if (r.total !== undefined) {
      document.getElementById('stat').textContent =
        'Pulang: ' + r.pulang + ' / ' + r.total + '  ·  Dilarang: ' + r.dilarang;
    }
  }

  function tampilIdle() {
    const box = document.getElementById('hasil');
    box.className = 'kotak';
    box.textContent = (MODE === 'layar')
      ? 'Menunggu santri melakukan scan...'
      : 'Arahkan kamera ke QR santri';
  }

  function tutupLayar() {
    clearTimeout(timerTutup);
    document.getElementById('layar').style.display = 'none';
    qna = null;
    tampilIdle();
    waktuTerakhir = Date.now();
    sibuk = false;
  }

  function el(tag, kelas, teks) {
    const e = document.createElement(tag);
    if (kelas) e.className = kelas;
    if (teks !== undefined) e.textContent = teks;
    return e;
  }

  function lencanaIzin(izin) {
    if (izin === 'BOLEH PULANG') return el('div', 'lencana boleh', izin);
    if (izin === 'DILARANG PULANG') return el('div', 'lencana larang', izin);
    return el('div', 'lencana umum', 'STATUS IZIN BELUM DIISI');
  }

  function infoSantri(r) {
    return (r.kelas ? 'Kelas ' + r.kelas : '') + (r.noInduk ? ' · No. Induk ' + r.noInduk : '');
  }

  function infoKelas(r) {
    return r.kelasTotal ? 'Kelas ' + r.kelas + ': ' + r.kelasPulang + ' / ' + r.kelasTotal + ' sudah pulang' : '';
  }

  function rincianDengan(r) {
    return (r.dengan || '') + (r.detail ? ' — ' + r.detail : '') + (r.ket ? ' (' + r.ket + ')' : '');
  }

  // Menentukan warna, judul, dan keterangan untuk tiap status dari server
  function susun(r) {
    switch (r.status) {
      case 'PALSU':
        return { warna: 'palsu', judul: '✖ QR TIDAK TERDAFTAR', baris: ['Jangan diizinkan'], nama: false, tutup: 1 };
      case 'DILARANG':
        return { warna: 'palsu', judul: '⛔ DILARANG PULANG',
          baris: [r.catatan ? 'Boleh pulang: ' + r.catatan : 'Belum ada tanggal boleh pulang'], tutup: 2 };
      case 'IZIN_KOSONG':
        return { warna: 'sudah', judul: '⚠ STATUS IZIN BELUM DIISI', baris: ['Hubungi panitia'], tutup: 2 };
      case 'SUDAH_PULANG':
        return { warna: 'sudah', judul: '⚠ SUDAH PULANG', baris: ['Pulang pada: ' + r.waktu, rincianDengan(r)], tutup: 1.5 };
      case 'PROSES':
        return { warna: 'biru', judul: '⏳ SEDANG DIPROSES', baris: ['Menunggu pertanyaan petugas'] };
      case 'PULANG_OK':
        return { warna: 'valid', judul: '✔ SILAKAN PULANG', baris: [rincianDengan(r), infoKelas(r)], tutup: 1 };
      case 'PIN_SALAH':
        return { warna: 'error', judul: 'PIN salah', baris: [], nama: false };
      default:
        return { warna: 'error', judul: 'Terjadi kesalahan', baris: [r.pesan || ''], nama: false };
    }
  }

  function tambahTombolX(layar) {
    const x = el('button', 'x', '✕');
    x.setAttribute('aria-label', 'Tutup');
    x.onclick = tutupLayar;
    layar.appendChild(x);
  }

  function tampil(r) {
    const layar = document.getElementById('layar');
    const box = document.getElementById('hasil');
    isiStat(r);
    layar.style.boxShadow = '';
    clearTimeout(timerTutup);

    if (r.status === 'LOADING') {
      box.className = 'kotak';
      box.textContent = 'Memeriksa...';
      return;
    }
    if (r.status === 'IDLE') {
      tampilIdle();
      layar.style.display = 'none';
      return;
    }
    if (r.status === 'KAMERA') {
      box.className = 'kotak error';
      box.textContent = r.pesan;
      return;
    }

    if (MODE === 'layar') { tampilMulti(r); return; }
    const bisaAksi = true;
    const suaraAktif = (MODE === 'hp' ? SUARA_HP : (MODE === 'layar' ? SUARA_LAYAR : true));
    if (suaraAktif) bunyi(r);

    if (r.status === 'BOLEH') {
      if (bisaAksi) { qnaMulai(r); return; }
      // mode layar: tampilMulti sudah menangani BOLEH sebelum sampai sini
      r = Object.assign({}, r, { status: 'PROSES' });
    }

    const s = susun(r);
    layar.innerHTML = '';
    layar.className = s.warna + ' pl';
    if (s.nama !== false && r.izin !== undefined) layar.appendChild(lencanaIzin(r.izin));
    layar.appendChild(el('div', 'besar', s.judul));
    if (s.nama !== false && r.nama) {
      layar.appendChild(el('div', 'nama', r.nama));
      const info = infoSantri(r);
      if (info) layar.appendChild(el('div', 'kecil', info));
    }
    s.baris.forEach(function (b) { if (b) layar.appendChild(el('div', 'kecil', b)); });

    if (bisaAksi) {
      const kotak = el('div', 'aksi');
      const t = el('button', 'btn utama', 'Tutup / scan berikutnya');
      t.onclick = tutupLayar;
      kotak.appendChild(t);
      layar.appendChild(kotak);
      if (TUTUP_OTOMATIS_MS > 0 && s.tutup) {
        timerTutup = setTimeout(tutupLayar, TUTUP_OTOMATIS_MS * s.tutup);
      }
    }
    tambahTombolX(layar);
    layar.style.display = 'flex';
  }

  // ---------- Pertanyaan sebelum pulang ----------
  function qnaMulai(r) {
    clearTimeout(timerTutup);
    qna = {
      kode: r.kode, nama: r.nama, kelas: r.kelas, noInduk: r.noInduk, izin: r.izin, opsi: r.opsi,
      langkah: 1, dengan: '', detail: '', ket: '', kirim: false
    };
    qnaGambar();
  }

  function qnaGambar() {
    const layar = document.getElementById('layar');
    layar.innerHTML = '';
    layar.className = 'biru pl';
    layar.style.boxShadow = '';
    layar.style.display = 'flex';

    layar.appendChild(lencanaIzin(qna.izin));
    layar.appendChild(el('div', 'nama', qna.nama));
    const info = infoSantri(qna);
    if (info) layar.appendChild(el('div', 'kecil', info));

    const kotak = el('div', 'aksi');
    function tombol(teks, fn, utama, mati) {
      const b = el('button', 'btn' + (utama ? ' utama' : ''), teks);
      if (mati) b.disabled = true;
      b.onclick = fn;
      kotak.appendChild(b);
      return b;
    }
    function ke(langkah) { return function () { qna.langkah = langkah; qnaGambar(); }; }
    // Langkah terakhir: simpan langsung, atau tampilkan layar konfirmasi bila KONFIRMASI_AKHIR = true
    function selesai() { if (KONFIRMASI_AKHIR) { qna.langkah = 3; qnaGambar(); } else { qnaKirim(); } }
    let fokus = null;

    if (qna.langkah === 1) {
      layar.appendChild(el('div', 'besar', 'Pulang dengan siapa?'));
      tombol('Dijemput', function () { qna.dengan = 'Dijemput'; qna.detail = ''; qna.ket = ''; qna.langkah = 2; qnaGambar(); });
      tombol('Pulang Sendiri', function () { qna.dengan = 'Pulang Sendiri'; qna.detail = ''; qna.ket = ''; qna.langkah = 2; qnaGambar(); });
      tombol('Batal', tutupLayar);
    } else if (qna.langkah === 2) {
      const dijemput = (qna.dengan === 'Dijemput');
      layar.appendChild(el('div', 'besar', dijemput ? 'Dijemput oleh siapa?' : 'Pulang naik apa?'));
      (dijemput ? qna.opsi.dijemput : qna.opsi.sendiri).forEach(function (o) {
        tombol(o === 'Lainnya' ? 'Lainnya...' : o, function () {
          qna.detail = o;
          qna.ket = '';
          if (o === 'Lainnya') { qna.langkah = 21; qnaGambar(); } else { selesai(); }
        }, false, qna.kirim);
      });
      tombol('Kembali', ke(1), false, qna.kirim);
    } else if (qna.langkah === 21) {
      layar.appendChild(el('div', 'besar', 'Tulis keterangan "Lainnya"'));
      const inp = el('input', 'ket');
      inp.type = 'text';
      inp.placeholder = 'Contoh: dijemput paman dari desa (minimal 3 huruf)';
      inp.maxLength = 120;
      inp.value = qna.ket;
      inp.disabled = qna.kirim;
      kotak.appendChild(inp);
      const lanjut = tombol(qna.kirim ? 'Menyimpan...' : (KONFIRMASI_AKHIR ? 'Lanjut' : 'Simpan'), selesai, true,
        qna.kirim || qna.ket.trim().length < 3);
      inp.oninput = function () {
        qna.ket = inp.value;
        lanjut.disabled = inp.value.trim().length < 3;
      };
      tombol('Kembali', ke(2), false, qna.kirim);
      fokus = inp;
    } else {
      layar.appendChild(el('div', 'besar', 'Periksa lagi'));
      layar.appendChild(el('div', 'kecil', 'Pulang dengan: ' + qna.dengan));
      layar.appendChild(el('div', 'kecil', 'Detail: ' + qna.detail + (qna.ket.trim() ? ' — ' + qna.ket.trim() : '')));
      tombol(qna.kirim ? 'Menyimpan...' : 'KONFIRMASI: IZINKAN PULANG', qnaKirim, true, qna.kirim);
      tombol('Kembali', ke(qna.detail === 'Lainnya' ? 21 : 2), false, qna.kirim);
      tombol('Batal', tutupLayar, false, qna.kirim);
    }

    layar.appendChild(kotak);
    tambahTombolX(layar);
    if (fokus && !qna.kirim) fokus.focus();
  }

  function qnaKirim() {
    if (!qna || qna.kirim) return;
    qna.kirim = true;
    qnaGambar();
    api('pl_simpan', {
      kode: qna.kode, pin: pin, dengan: qna.dengan, detail: qna.detail, ket: qna.ket.trim()
    })
      .then(function (r) { qna = null; tampil(r); })
      .catch(function (e) {
        if (qna) { qna.kirim = false; qnaGambar(); }
        alert('Gagal menyimpan: ' + e.message + '. Coba lagi.');
      });
  }


  // ===== MULTI-SLOT =====
  const slots = [];
  let idUnik = 0;

  function arenaEl() { return document.getElementById('arena'); }

  function perbarui() {
    const n = Math.min(slots.length, 6);
    const el = arenaEl();
    el.setAttribute('data-n', String(n));
    if (n > 0) el.classList.add('aktif'); else el.classList.remove('aktif');
    if (n === 0) {
      document.getElementById('hasil').textContent = 'Menunggu santri melakukan scan...';
    }
    // paksa reflow supaya animasi berjalan
    void el.offsetWidth;
  }

  function hapusSlot(s, tunda) {
    // Jangan tutup paksa kalau masih diproses (langkah < 99), kecuali diminta tunda = 0 oleh tombol Batal
    if (tunda !== 0 && s.langkah < 99) return;
    clearTimeout(s.timerId);
    function lakukan() {
      if (!s.el) return;
      s.el.classList.remove('masuk');
      s.el.classList.add('keluar');
      setTimeout(function () {
        if (s.el && s.el.parentNode) s.el.parentNode.removeChild(s.el);
        const i = slots.indexOf(s);
        if (i >= 0) slots.splice(i, 1);
        perbarui();
      }, 380);
    }
    if (tunda) s.timerId = setTimeout(lakukan, tunda); else lakukan();
  }

  function mulaiProgres(s) {
    if (!s.el) return;
    const bar = s.el.querySelector('.progres-s');
    if (!bar) return;
    bar.style.transition = 'none';
    bar.style.width = '100%';
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        bar.style.transition = 'width ' + TUTUP_SLOT_MS + 'ms linear';
        bar.style.width = '0%';
      });
    });
  }

  function elT(tag, kls, teks) {
    const e = document.createElement(tag);
    if (kls) e.className = kls;
    if (teks !== undefined) e.textContent = teks;
    return e;
  }

  function gambarSlot(s, isNew) {
    let div = s.el;
    if (!div) {
      div = document.createElement('div');
      s.el = div;
      arenaEl().appendChild(div);
    }
    div.innerHTML = '';
    div.className = 'slot' + (isNew ? ' masuk' : '');

    // tombol X hanya di hasil akhir (class 'akhir' ditambah nanti)
    const xBtn = elT('button', 'x-s', '✕');
    xBtn.style.display = 'none';
    xBtn.onclick = function () { hapusSlot(s, 0); };
    div.appendChild(xBtn);

    div.appendChild(elT('div', 'lencana-s ' + (s.izin === 'BOLEH PULANG' ? 'boleh' : 'larang'), s.izin));
    div.appendChild(elT('div', 'nama-s', s.nama));
    div.appendChild(elT('div', 'sub-s kelas-s', 'Kelas ' + s.kelas + (s.noInduk ? ' · No. Induk ' + s.noInduk : '')));

    const kotak = elT('div', 'aksi-s');
    function tombol(teks, fn, utama, mati) {
      const b = elT('button', utama ? 'utama' : '', teks);
      if (mati) b.disabled = true;
      b.onclick = fn;
      kotak.appendChild(b);
      return b;
    }

    if (s.langkah === 1) {
      div.classList.add('biru-s');
      div.appendChild(elT('div', 'tanya-s', 'Pulang dengan siapa?'));
      tombol('Dijemput', function () { s.dengan = 'Dijemput'; s.langkah = 2; gambarSlot(s, false); });
      tombol('Pulang Sendiri', function () { s.dengan = 'Pulang Sendiri'; s.langkah = 2; gambarSlot(s, false); });
      tombol('Batal', function () { hapusSlot(s, 0); });

    } else if (s.langkah === 2) {
      div.classList.add('biru-s');
      div.appendChild(elT('div', 'tanya-s', s.dengan === 'Dijemput' ? 'Dijemput oleh siapa?' : 'Pulang naik apa?'));
      const daftar = s.dengan === 'Dijemput' ? s.opsi.dijemput : s.opsi.sendiri;
      daftar.forEach(function (o) {
        tombol(o === 'Lainnya' ? 'Lainnya...' : o, function () {
          s.detail = o; s.ket = '';
          if (o === 'Lainnya') { s.langkah = 21; gambarSlot(s, false); }
          else { slotKirim(s); }
        }, false, s.kirim);
      });
      tombol('Kembali', function () { s.langkah = 1; gambarSlot(s, false); }, false, s.kirim);

    } else if (s.langkah === 21) {
      div.classList.add('biru-s');
      div.appendChild(elT('div', 'tanya-s', 'Tulis keterangan "Lainnya"'));
      const inp = elT('input', 'ket-s');
      inp.type = 'text'; inp.placeholder = 'Minimal 3 huruf'; inp.maxLength = 120;
      inp.value = s.ket; inp.disabled = s.kirim;
      kotak.appendChild(inp);
      const lanjut = tombol(s.kirim ? 'Menyimpan...' : 'Simpan', function () { slotKirim(s); }, true,
        s.kirim || s.ket.trim().length < 3);
      inp.oninput = function () { s.ket = inp.value; lanjut.disabled = inp.value.trim().length < 3; };
      tombol('Kembali', function () { s.langkah = 2; gambarSlot(s, false); }, false, s.kirim);
      if (!s.kirim) setTimeout(function () { inp.focus(); }, 50);

    } else {
      // Kartu PROSES tetap tampil tanpa tombol X/timer sampai hasil akhir diterima.
      if (s._menunggu) {
        div.classList.add('biru-s');
        div.appendChild(elT('div', 'tanya-s', s._judul || '⏳ SEDANG DIPROSES'));
        if (s._info) div.appendChild(elT('div', 'sub-s', s._info));
      } else {
        // Hasil akhir: tampil beberapa detik, lalu hilang otomatis.
        xBtn.style.display = 'flex';
        div.classList.add('akhir');
        const w = s._warna || 'sudah-s';
        div.classList.add(w);
        div.appendChild(elT('div', 'tanya-s', s._judul || ''));
        if (s._info) div.appendChild(elT('div', 'sub-s info-s', s._info));
        if (w === 'valid-s') {
          div.appendChild(elT('div', 'salam-s', '✦ SELAMAT JALAN! ✦'));
          div.appendChild(elT('div', 'pesan-s', 'Semoga perjalanan lancar, selamat sampai tujuan.'));
        }
        const bar = elT('div', 'progres-s'); div.appendChild(bar);
        if (SUARA_LAYAR) bunyi({ status: s._bunyi || 'SUDAH_PULANG' });
        if (TUTUP_SLOT_MS > 0) {
          mulaiProgres(s);
          hapusSlot(s, TUTUP_SLOT_MS);
        }
      }
    }

    div.appendChild(kotak);
    perbarui();
  }

  function slotKirim(s) {
    if (s.kirim) return;
    s.kirim = true; gambarSlot(s, false);
    api('pl_simpan', { kode: s.kode, pin: pin, dengan: s.dengan, detail: s.detail, ket: s.ket.trim() })
      .then(function (r) {
        isiStat(r);
        if (r.status === 'PULANG_OK') {
          s._warna = 'valid-s'; s._bunyi = 'PULANG_OK'; s._judul = '✔ SILAKAN PULANG';
          s._info = (r.dengan || '') + (r.detail ? ' — ' + r.detail : '') + (r.ket ? ' (' + r.ket + ')' : '');
          if (r.kelas) s._info += (s._info ? '  ' : '') + 'Kelas ' + r.kelas + ': ' + r.kelasPulang + '/' + r.kelasTotal + ' pulang';
        } else if (r.status === 'SUDAH_PULANG') {
          s._warna = 'sudah-s'; s._judul = '⚠ SUDAH PULANG'; s._info = 'Pulang pada: ' + r.waktu;
        } else if (r.status === 'DILARANG') {
          s._warna = 'palsu-s'; s._bunyi = 'DILARANG'; s._judul = '⛔ DILARANG PULANG';
          s._info = r.catatan ? 'Boleh pulang: ' + r.catatan : '';
        } else {
          s._warna = 'sudah-s'; s._judul = '⚠ ' + (r.status || 'ERROR'); s._info = r.pesan || '';
        }
        s.langkah = 99; s.kirim = false; gambarSlot(s, false);
      })
      .catch(function (e) {
        s.kirim = false;
        // Slot tetap terbuka agar petugas bisa coba lagi
        if (slots.indexOf(s) >= 0) {
          gambarSlot(s, false);
          alert('Gagal menyimpan ' + s.nama + ': ' + e.message + '. Coba lagi.');
        }
      });
  }

  function tampilMulti(r) {
    isiStat(r);

    // Mode layar hanya menampilkan informasi. Semua pertanyaan dijawab di HP petugas.
    // Gunakan kode QR sebagai kunci agar status berikutnya memperbarui kartu yang sama.
    const kode = String(r.kode || '').trim().toUpperCase();
    const kartuLama = kode ? slots.find(function (s) {
      return String(s.kode || '').trim().toUpperCase() === kode;
    }) : null;

    const s0 = {
      id: ++idUnik, kode: kode, nama: r.nama || '', kelas: r.kelas || '',
      noInduk: r.noInduk || '', izin: r.izin || '',
      opsi: r.opsi || { dijemput: ['Wali santri asli','Wali santri lain','Kerabat/Teman','Lainnya'], sendiri: ['Bis','Travel','Kereta','Lainnya'] },
      langkah: 99, dengan: '', detail: '', ket: '', kirim: false, timerId: null, el: null,
      _warna: null, _bunyi: null, _judul: null, _info: null, _menunggu: false
    };

    // Scan awal / status proses: buat satu kartu pasif, tanpa tombol pertanyaan.
    if (r.status === 'BOLEH' || r.status === 'PROSES') {
      const s = kartuLama || s0;
      s.nama = r.nama || s.nama;
      s.kelas = r.kelas || s.kelas;
      s.noInduk = r.noInduk || s.noInduk;
      s.izin = r.izin || s.izin;
      s._warna = 'biru-s';
      s._bunyi = null;
      s._judul = '⏳ SEDANG DIPROSES';
      s._info = 'Menunggu jawaban petugas';
      s._menunggu = true;
      s.langkah = 99;
      if (!kartuLama) slots.push(s);
      else clearTimeout(s.timerId);
      gambarSlot(s, !kartuLama);
      return;
    }

    // Pemetaan status akhir. Jangan menampilkan kode teknis PULANG_OK ke layar.
    if (r.status === 'PULANG_OK') {
      s0._warna = 'valid-s';
      s0._bunyi = 'PULANG_OK';
      s0._judul = '✔ SILAKAN PULANG';
      s0._info = rincianDengan(r);
      const kelasInfo = infoKelas(r);
      if (kelasInfo) s0._info += (s0._info ? ' · ' : '') + kelasInfo;
    } else if (r.status === 'SUDAH_PULANG') {
      s0._warna = 'sudah-s'; s0._judul = '⚠ SUDAH PULANG';
      s0._info = 'Pulang pada: ' + (r.waktu || '-');
    } else if (r.status === 'DILARANG') {
      s0._warna = 'palsu-s'; s0._bunyi = 'DILARANG'; s0._judul = '⛔ DILARANG PULANG';
      s0._info = r.catatan ? 'Boleh pulang: ' + r.catatan : '';
    } else if (r.status === 'PALSU') {
      s0._warna = 'palsu-s'; s0._bunyi = 'PALSU'; s0._judul = '✖ QR TIDAK TERDAFTAR';
      s0._info = 'Silakan periksa QR santri';
    } else if (r.status === 'IZIN_KOSONG') {
      s0._warna = 'sudah-s'; s0._judul = '⚠ STATUS IZIN BELUM DIISI'; s0._info = 'Hubungi panitia';
    } else {
      s0._warna = 'sudah-s'; s0._judul = '⚠ TERJADI KESALAHAN'; s0._info = r.pesan || '';
    }
    s0._menunggu = false;

    // Jika kartu proses sudah ada, ubah kartu tersebut menjadi hasil akhir.
    if (kartuLama) {
      clearTimeout(kartuLama.timerId);
      kartuLama.nama = r.nama || kartuLama.nama;
      kartuLama.kelas = r.kelas || kartuLama.kelas;
      kartuLama.noInduk = r.noInduk || kartuLama.noInduk;
      kartuLama.izin = r.izin || kartuLama.izin;
      kartuLama._warna = s0._warna;
      kartuLama._bunyi = s0._bunyi;
      kartuLama._judul = s0._judul;
      kartuLama._info = s0._info;
      kartuLama._menunggu = false;
      kartuLama.langkah = 99;
      gambarSlot(kartuLama, false);
      return;
    }

    slots.push(s0);
    gambarSlot(s0, true);
  }

</script>
